name: Site changed / selectors broke
description: Maison KOSÉ changed something and the parser no longer matches.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most common way a scraper stops working, and it is worth its
        own report because the fix is different from a code bug: something on
        maison.kose.co.jp moved.

        Useful to know before filing: a LISTING page carries no JSON-LD, so
        listings are read from the tile markup (`li.c-product__item` and a
        `/g/g{SKU}/` link); a PRODUCT page is read from its one JSON-LD
        `Product` block. Which route broke narrows the fix a lot.

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped matching
      options:
        - Products (0 rows on a page that visibly has products)
        - A specific field is null or wrong (price, sku, image, URL)
        - tax_rate or in_stock reads wrong
        - Pagination stops early or repeats a page
        - The captcha detector finds nothing on a page that has one
        - Something else
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: The exact listing or product URL, and where your exit IP was.
      placeholder: "https://maison.kose.co.jp/site/cosmedecorte/c/c15/ (exit IP: DE datacentre)"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence from the page
      description: |
        Whichever of these you can get. A capture beats a description.

        - For a product page, its JSON-LD as the page actually serves it:
          `python3 -c "import json,sys,re;h=open('dump.html').read();print([m[:400] for m in re.findall(r'<script type=\"application/ld\\+json\">(.*?)</script>',h,re.S)][:2])"`
        - For a listing: one `li.c-product__item` tile's outer HTML.
        - For a field problem: the value you got, and the value on the page.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, whether it reproduces from a
        different country, and when it last worked.
